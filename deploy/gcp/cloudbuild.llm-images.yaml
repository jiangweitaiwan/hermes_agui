# Host and Runtime/Worker are built and verified from the same submitted commit.
steps:
  - id: host-image
    name: gcr.io/cloud-builders/docker@sha256:2d89b48c704ddcc4a199dd1cc70c21813fb675227600f19cb77e5bbf368012bc
    args:
      - build
      - --file=Dockerfile.agui
      - --tag=${_IMAGE_PREFIX}/hermes-host:${_IMAGE_TAG}
      - --label=org.opencontainers.image.version=${_IMAGE_TAG}
      - --label=org.opencontainers.image.revision=${_SOURCE_COMMIT}
      - .
  - id: verify-source
    name: gcr.io/cloud-builders/docker@sha256:2d89b48c704ddcc4a199dd1cc70c21813fb675227600f19cb77e5bbf368012bc
    args:
      - run
      - --rm
      - --volume=/workspace:/workspace:ro
      - --entrypoint=python
      - ${_IMAGE_PREFIX}/hermes-host:${_IMAGE_TAG}
      - /workspace/scripts/ci/source_identity.py
      - verify
      - /workspace
      - --sha256=${_SOURCE_SHA256}
  - id: host-job-integrity
    name: gcr.io/cloud-builders/docker@sha256:2d89b48c704ddcc4a199dd1cc70c21813fb675227600f19cb77e5bbf368012bc
    args:
      - run
      - --rm
      - --entrypoint=python
      - ${_IMAGE_PREFIX}/hermes-host:${_IMAGE_TAG}
      - -c
      - "import importlib; [importlib.import_module(n) for n in ('hermes_agui.host', 'hermes_agui.storage.completion_delivery', 'hermes_agui.storage.reconcile')]; import sqlite3; assert sqlite3.sqlite_version_info >= (3, 51, 3)"
  - id: node-contracts
    name: gcr.io/cloud-builders/docker@sha256:2d89b48c704ddcc4a199dd1cc70c21813fb675227600f19cb77e5bbf368012bc
    entrypoint: bash
    args:
      - -ceu
      - |
        docker build --file=deploy/gcp/Dockerfile.llm-ci \
          --build-arg=HOST_IMAGE=${_IMAGE_PREFIX}/hermes-host:${_IMAGE_TAG} \
          --tag=hermes-llm-contracts .
        docker network create llm-schema
        docker run -d --name llm-schema-pg --network llm-schema \
          --env POSTGRES_USER=hermes --env POSTGRES_HOST_AUTH_METHOD=trust \
          postgres:17@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
        for attempt in $$(seq 1 30); do
          docker exec llm-schema-pg pg_isready -U hermes && break
          sleep 1
        done
        docker run --rm --network llm-schema --volume=/workspace:/workspace \
          --workdir=/workspace/examples/copilotkit \
          --env=HERMES_PYTHON=/opt/hermes/.venv/bin/python \
          hermes-llm-contracts -ceu '
            ln -s /opt/hermes/.venv /workspace/.venv
            npm ci --ignore-scripts --no-audit --no-fund
            npm test -- tests/runtime.test.ts tests/cloud.test.ts tests/llm-registry.test.ts --maxWorkers=2
            npm run build
            node --import tsx server/storage/schema-contract.ts \
              postgres://hermes@llm-schema-pg/postgres /workspace \
              server/storage/schema-contract.json
          '
        docker rm -f llm-schema-pg
        docker network rm llm-schema
  - id: runtime-image
    name: gcr.io/cloud-builders/docker@sha256:2d89b48c704ddcc4a199dd1cc70c21813fb675227600f19cb77e5bbf368012bc
    args:
      - build
      - --file=examples/copilotkit/Dockerfile
      - --tag=${_IMAGE_PREFIX}/hermes-runtime:${_IMAGE_TAG}
      - --label=org.opencontainers.image.version=${_IMAGE_TAG}
      - --label=org.opencontainers.image.revision=${_SOURCE_COMMIT}
      - examples/copilotkit
  - id: image-integrity
    name: gcr.io/cloud-builders/docker@sha256:2d89b48c704ddcc4a199dd1cc70c21813fb675227600f19cb77e5bbf368012bc
    entrypoint: bash
    args:
      - -ceu
      - |
        for image in hermes-host hermes-runtime; do
          test "$$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' ${_IMAGE_PREFIX}/$${image}:${_IMAGE_TAG})" = '${_SOURCE_COMMIT}'
          test "$$(docker image inspect --format '{{.Config.User}}' ${_IMAGE_PREFIX}/$${image}:${_IMAGE_TAG})" = '10000:10000'
        done

images:
  - ${_IMAGE_PREFIX}/hermes-host:${_IMAGE_TAG}
  - ${_IMAGE_PREFIX}/hermes-runtime:${_IMAGE_TAG}
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 4800s
