cloud:
  hosts: [HOST_SERVICE.run.app, localhost, 127.0.0.1]
bots: []
max_active_runs: 4
storage:
  project: workspace
  prefix: profiles
  scratch: /tmp
  graph_completions: true
management:
  root: /tmp/managed
  token_env: AGUI_HOST_MANAGEMENT_TOKEN
  max_bots: 128
  templates:
    assistant:
      model: openai/gpt-4.1-mini
      provider: openrouter
      api_key_env: OPENROUTER_API_KEY
      toolsets: [memory, skills]
      skills: {}

delegation:
  url: https://RUNTIME_SERVICE.run.app/internal/delegations
  audience: https://RUNTIME_SERVICE.run.app
  token_env: AGUI_DELEGATION_TOKEN
  timeout: 60
