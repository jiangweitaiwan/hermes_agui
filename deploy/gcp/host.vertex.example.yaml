bots: []
cloud:
  hosts: [HOST_SERVICE.run.app, localhost, 127.0.0.1]
delegation: {audience: 'https://RUNTIME_SERVICE.run.app', timeout: 60, token_env: AGUI_DELEGATION_TOKEN,
  url: 'https://RUNTIME_SERVICE.run.app/internal/delegations'}
llm:
  models:
  - alias: agent_primary
    fallback: []
    maxTokens: 4096
    model: gemini-2.5-flash
    provider: vertex
    retries: 0
    timeoutMs: 30000
  - alias: graph_parser
    fallback: []
    maxTokens: 4096
    model: gemini-2.5-flash
    provider: vertex
    retries: 1
    timeoutMs: 30000
  - alias: graph_matcher
    fallback: []
    maxTokens: 4096
    model: gemini-2.5-flash
    provider: vertex
    retries: 1
    timeoutMs: 30000
  - alias: graph_relations
    fallback: []
    maxTokens: 4096
    model: gemini-2.5-flash
    provider: vertex
    retries: 1
    timeoutMs: 30000
  - alias: graph_query
    fallback: []
    maxTokens: 2048
    model: gemini-2.5-flash
    provider: vertex
    retries: 0
    timeoutMs: 2000
  - alias: graph_story
    fallback: []
    maxTokens: 2048
    model: gemini-2.5-flash
    provider: vertex
    retries: 0
    timeoutMs: 1500
  - alias: graph_embedding
    dimension: 768
    fallback: []
    maxTokens: 4096
    model: gemini-embedding-001
    provider: vertex
    retries: 0
    timeoutMs: 500
    version: v1
  providers:
  - auth: adc
    capabilities: [chat, structured_output, embedding]
    driver: vertex
    id: vertex
    location: us-central1
    project: your-project
  version: 1
management:
  max_bots: 128
  root: /tmp/managed # no-tmp: ok — Cloud Run materializes durable managed profiles here
  templates:
    assistant:
      model_role: agent_primary
      skills: {}
      toolsets: [memory, skills]
  token_env: AGUI_HOST_MANAGEMENT_TOKEN
max_active_runs: 4
storage: {graph_completions: true, prefix: profiles, project: workspace, scratch: /tmp} # no-tmp: ok — Cloud Run container scratch, never durable state
