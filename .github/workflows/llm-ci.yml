name: LLM deployment gates

on:
  pull_request:
  workflow_call:

# No OIDC, environments, cloud credentials, or production secrets in this lane.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
        env:
          POSTGRES_USER: hermes
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        volumes:
          - /var/run/postgresql:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -U hermes"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AGUI_LLM_TEST_ADMIN_URL: postgres://hermes@127.0.0.1:5432/postgres
      HERMES_AGUI_TEST_DB_SOCKET: /var/run/postgresql
      COMPATIBILITY_BASE_COMMIT: ${{ vars.COMPATIBILITY_BASE_COMMIT }}

    steps:
      - name: Initialize runner environment
        shell: bash
        run: |
          echo "HERMES_HOME=$RUNNER_TEMP/hermes-ci-home" >> "$GITHUB_ENV"
          echo "HERMES_RUNTIME_DIR=$RUNNER_TEMP/hermes-ci-tools" >> "$GITHUB_ENV"
          echo "CI_EVIDENCE_DIR=$RUNNER_TEMP/llm-ci-evidence" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare pinned PM tools and one lockfile test environment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pm import ensure, installed_package
          for name in ('python', 'node'):
              ensure(name, explicit=True)
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              for name in ('python', 'node'):
                  output.write(str(installed_package(name).binary.parent) + '\n')
          PY
      - name: Build test environment
        run: |
          python3 -m pm.build_env --source . --out "$RUNNER_TEMP/llm-test-env" \
            --extra agui --extra agui-cloud --group dev --group test
          echo "HERMES_PYTHON=$RUNNER_TEMP/llm-test-env/bin/python" >> "$GITHUB_ENV"
      - name: Install locked Node dependencies
        working-directory: examples/copilotkit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, build, core API, disposable PG and compatibility gates
        run: bash scripts/ci/llm_offline_ci.sh
      - name: Retain redacted offline gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-offline-ci
          path: ${{ runner.temp }}/llm-ci-evidence
          if-no-files-found: error
          retention-days: 14
