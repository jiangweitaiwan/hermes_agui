name: LLM console CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built images to existing Cloud Run services
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: llm-console-rollout
  cancel-in-progress: false

# Non-secret deployment coordinates. WIF trusts only this workflow on main.
env:
  GCP_PROJECT_ID: copilotkit-agui
  GCP_BUILD_REGION: asia-east1
  GCP_IMAGE_REGION: asia-east1
  GCP_ARTIFACT_REPOSITORY: hermes
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/746997613973/locations/global/workloadIdentityPools/github-hermes/providers/github
  GCP_SUBMIT_SERVICE_ACCOUNT: github-hermes-cicd@copilotkit-agui.iam.gserviceaccount.com
  GCP_BUILD_SERVICE_ACCOUNT: github-hermes-cicd@copilotkit-agui.iam.gserviceaccount.com
  GCP_DEPLOY_SERVICE_ACCOUNT: github-hermes-cicd@copilotkit-agui.iam.gserviceaccount.com
  GCP_SMOKE_SERVICE_ACCOUNT: github-hermes-cicd@copilotkit-agui.iam.gserviceaccount.com
  GCP_BUILD_SOURCE_BUCKET: copilotkit-agui-hermes-data

jobs:
  ci:
    uses: ./.github/workflows/llm-ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: llm-build
    outputs:
      host_image: ${{ steps.publish.outputs.host_image }}
      runtime_image: ${{ steps.publish.outputs.runtime_image }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llm-offline-ci
          path: ${{ runner.temp }}/llm-ci-evidence
      - name: Validate configuration and prepare tracked source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Cloud builds and deployment must use main.'
            exit 1
          fi
          for name in GCP_PROJECT_ID GCP_BUILD_REGION GCP_IMAGE_REGION GCP_ARTIFACT_REPOSITORY GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SUBMIT_SERVICE_ACCOUNT GCP_BUILD_SERVICE_ACCOUNT GCP_BUILD_SOURCE_BUCKET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing llm-build environment variable: $name"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/llm-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/llm-source"
          python3 scripts/ci/source_identity.py create "$RUNNER_TEMP/llm-source" > "$RUNNER_TEMP/llm-source.sha256"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SUBMIT_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Build, verify and publish images using Cloud Build
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          image_prefix="${GCP_IMAGE_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}"
          # The archive was created before auth, so generated WIF credentials never enter the upload.
          gcloud builds submit "$RUNNER_TEMP/llm-source" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_BUILD_REGION" \
            --config="$RUNNER_TEMP/llm-source/deploy/gcp/cloudbuild.llm-images.yaml" \
            --ignore-file=/dev/null \
            --gcs-source-staging-dir="gs://${GCP_BUILD_SOURCE_BUCKET}/llm-source" \
            --service-account="projects/${GCP_PROJECT_ID}/serviceAccounts/${GCP_BUILD_SERVICE_ACCOUNT}" \
            --substitutions="_IMAGE_PREFIX=${image_prefix},_IMAGE_TAG=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT},_SOURCE_COMMIT=${GITHUB_SHA},_SOURCE_SHA256=$(cat "$RUNNER_TEMP/llm-source.sha256")" \
            --suppress-logs --format=json --quiet > "$RUNNER_TEMP/llm-build.json"
          python3 -m scripts.ci.llm_release_manifest \
            --build "$RUNNER_TEMP/llm-build.json" --prefix "$image_prefix" \
            --commit "$GITHUB_SHA" --tag "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --source-sha256 "$(cat "$RUNNER_TEMP/llm-source.sha256")" \
            --gates "$RUNNER_TEMP/llm-ci-evidence/offline-ci.json" \
            --output "$RUNNER_TEMP/llm-release-manifest.json"
          python3 scripts/ci/llm_build_outputs.py "$RUNNER_TEMP/llm-build.json" "$image_prefix" "$GITHUB_OUTPUT"
          {
            echo '### Published candidate images'
            echo "- Host: ${image_prefix}/hermes-host:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "- Runtime / Worker: ${image_prefix}/hermes-runtime:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo 'Resolved immutable image digests are passed to the deploy job. Build logs and results are in Cloud Build.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-release-manifest
          path: ${{ runner.temp }}/llm-release-manifest.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: build
    if: vars.AUTO_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: llm-deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llm-release-manifest
          path: ${{ runner.temp }}/llm-release
      - name: Database preparation, maintenance rollout and candidate smoke
        env:
          GCP_DATABASE_JOB: hermes-database-prepare
          GCP_HOST_MIGRATION_JOB: hermes-host-migrate
          GCP_SCHEDULER_JOBS: ${{ vars.LLM_SCHEDULER_JOBS }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST: ${{ runner.temp }}/llm-release/llm-release-manifest.json
          DEPLOY_REPORT: ${{ runner.temp }}/llm-deploy-report.json
        run: bash scripts/ci/deploy_llm_cloud_run.sh
      - name: Retain deployment result even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-deploy-report
          path: ${{ runner.temp }}/llm-deploy-report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Deployment summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/llm-deploy-report.json" ]]; then
            { echo '### Cloud Run deployment'; echo '```json'; cat "$RUNNER_TEMP/llm-deploy-report.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Deployment did not start; see failed prerequisite.' >> "$GITHUB_STEP_SUMMARY"
          fi

  report:
    if: always()
    needs: [ci, build, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Release outcome
        env:
          COMMIT: ${{ github.sha }}
          GATES: ${{ needs.ci.result }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          HOST: ${{ needs.build.outputs.host_image }}
          RUNTIME: ${{ needs.build.outputs.runtime_image }}
        run: |
          {
            echo '### Release result'
            echo "Commit: $COMMIT"
            echo "Critical gates: $GATES; image build/integrity: $BUILD; deployment job: $DEPLOY"
            echo "Host / Completion / Reconcile: $HOST"
            echo "Runtime / Worker: $RUNTIME"
            echo 'Revision names and DEPLOYED / FAILED_SAFE / ROLLED_BACK / RECOVERY_REQUIRED are in llm-deploy-report when rollout started. A skipped deploy is not a successful deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
